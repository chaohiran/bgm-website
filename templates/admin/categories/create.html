{% extends "base.html" %}

{% block title %}Create Category{% endblock %}

{% block content %}
<div class="container py-5">

  <h2 class="fw-bold mb-4">Create Category</h2>

  <div class="card shadow-sm border-0 rounded-4 p-4">

    <form method="POST" enctype="multipart/form-data">

      <!-- KEY (SLUG) -->
      <div class="mb-3">
        <label class="form-label">Category Key (slug)</label>
        <input type="text" name="key" class="form-control" required>
      </div>

      <!-- THAI NAME -->
      <div class="mb-3">
        <label class="form-label">Category Name (TH)</label>
        <input type="text" name="name_th" class="form-control" required>
      </div>

      <!-- ENGLISH NAME -->
      <div class="mb-3">
        <label class="form-label">Category Name (EN)</label>
        <input type="text" name="name_en" class="form-control" required>
      </div>

      <!-- IMAGE -->
      <div class="mb-3">
        <label class="form-label">Image</label>
        <input type="file" name="image" class="form-control" accept="image/*">
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Create
      </button>

    </form>

  </div>

</div>
{% endblock %}
