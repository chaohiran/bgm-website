{% extends "base.html" %}

{% block title %}Edit Category | BGM{% endblock %}

{% block content %}
<div class="container py-5">

  <h2 class="fw-bold mb-4">Edit Category</h2>

  <div class="card shadow-sm border-0 rounded-4 p-4">

    <form method="POST" enctype="multipart/form-data">

      <!-- KEY (SLUG) -->
      <div class="mb-3">
        <label class="form-label">Category Key (slug)</label>
        <input type="text"
               name="key"
               class="form-control"
               value="{{ category['key'] or category['slug'] or '' }}"
               required>
      </div>

      <!-- NAME TH -->
      <div class="mb-3">
        <label class="form-label">Category Name (TH)</label>
        <input type="text"
               name="name_th"
               class="form-control"
               value="{{ category['name_th'] or '' }}"
               required>
      </div>

      <!-- NAME EN -->
      <div class="mb-3">
        <label class="form-label">Category Name (EN)</label>
        <input type="text"
               name="name_en"
               class="form-control"
               value="{{ category['name_en'] or '' }}"
               required>
      </div>

      <!-- CURRENT IMAGE -->
      <div class="mb-3">
        <label class="form-label">Current Image</label><br>

        <img
          src="{{ url_for('static', filename='img/categories/' ~ (category['image'] or 'default.jpg')) }}"
          style="height:120px;object-fit:cover;border-radius:10px;"
          onerror="this.src='{{ url_for('static', filename='img/categories/default.jpg') }}'"
        >
      </div>

      <!-- UPLOAD IMAGE -->
      <div class="mb-3">
        <label class="form-label">Change Image</label>
        <input type="file"
               name="image"
               class="form-control"
               accept="image/*">
      </div>

      <!-- BUTTONS -->
      <div class="d-flex gap-2">

        <button type="submit" class="btn btn-primary w-100">
          Save Changes
        </button>

        <a href="{{ url_for('admin_categories.index') }}"
           class="btn btn-secondary w-100">
          Cancel
        </a>

      </div>

    </form>

  </div>

</div>
{% endblock %}
